<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Private brief</title>
<style>
:root{
  --ink:#eaf0fa;--mut:#9fb0c8;--teal:#34e0c4;--gold:#f6c75e;--red:#ff7a7a;--blue:#6db5ff;--violet:#a78bfa;
  --glass:rgba(255,255,255,.055);--glass2:rgba(255,255,255,.085);--stroke:rgba(255,255,255,.12);--stroke2:rgba(255,255,255,.20);
  --shadow:0 18px 50px rgba(0,0,0,.45);--inlite:inset 0 1px 0 rgba(255,255,255,.14);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;background:#05070e;min-height:100vh;
  background-image:
    radial-gradient(900px 600px at 12% -8%, rgba(52,224,196,.18), transparent 60%),
    radial-gradient(900px 700px at 92% 4%, rgba(120,110,255,.20), transparent 60%),
    radial-gradient(800px 600px at 60% 100%, rgba(246,199,94,.10), transparent 60%),
    linear-gradient(180deg,#070b16,#05070e);
  background-attachment:fixed;
}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
.glass{background:var(--glass);border:1px solid var(--stroke);border-radius:22px;
  -webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%);box-shadow:var(--shadow),var(--inlite)}
/* lock */
#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.lockcard{width:100%;max-width:380px;padding:34px 30px;text-align:center}
.lockcard .lk{font-size:30px}.lockcard h1{font-size:18px;margin:14px 0 4px}.lockcard p{color:var(--mut);font-size:13px;margin:0 0 18px}
#pw{width:100%;padding:13px 14px;border-radius:13px;border:1px solid var(--stroke2);background:rgba(0,0,0,.25);color:var(--ink);font-size:15px;text-align:center;letter-spacing:.14em}
#pw:focus{outline:none;border-color:var(--teal)}
.lockcard button{margin-top:12px;width:100%;padding:13px;border:0;border-radius:13px;background:linear-gradient(180deg,#3df0d2,#1fbfa6);color:#04211c;font-weight:800;font-size:15px;cursor:pointer}
.remember{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:12px;color:var(--mut);font-size:12.5px;cursor:pointer}
.remember input{accent-color:var(--teal)}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:10px}.hint{color:#5b6b86;font-size:11px;margin-top:14px}
#lockbtn{position:fixed;top:14px;right:14px;z-index:9;cursor:pointer;border-radius:12px;padding:7px 12px;font-size:12px;color:var(--mut);
  background:var(--glass2);border:1px solid var(--stroke2);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
#lockbtn:hover{color:var(--ink)}
/* layout — one layered surface */
#app{display:none}
.shell{max-width:1000px;margin:26px auto;padding:26px 26px 36px}
.panel{padding:18px 18px;margin:14px 0;border-radius:18px;background:var(--glass2);border:1px solid var(--stroke);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:var(--inlite)}
.eyebrow{color:var(--teal);font-size:12px;letter-spacing:.2em;font-weight:700}
.hero h1{font-size:34px;letter-spacing:-.02em;margin:8px 0 4px}
.hero .sub{color:var(--mut);font-size:15px;margin-bottom:14px}
.verdict{font-size:14.5px;border-left:3px solid var(--gold);padding-left:14px}
h2.sec{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin:30px 4px 10px}
/* chips */
.chips{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:9px;padding:9px 14px;border-radius:999px;background:var(--glass2);
  border:1px solid var(--stroke2);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:var(--inlite);font-size:13.5px}
.chip .cl{color:var(--mut);font-size:11.5px;letter-spacing:.04em}
.chip .cv{font-weight:800;color:var(--ink)}
.chip.edit .cv{outline:none;min-width:18px;padding:0 2px;border-bottom:1px dashed rgba(255,255,255,.35);cursor:text}
.chip.edit .cv:focus{border-bottom-color:var(--teal);background:rgba(52,224,196,.08)}
.chip.edit::after{content:'✎';font-size:11px;opacity:.45}
.chip.accent{border-color:rgba(52,224,196,.5);box-shadow:0 0 0 1px rgba(52,224,196,.15) inset,var(--inlite)}
.chip.reset{cursor:pointer;color:var(--mut)}.chip.reset:hover{color:var(--ink)}
.chip.doc{cursor:default}
.chip.doc .dot{width:7px;height:7px;border-radius:50%;background:var(--mut)}
.chip.doc.has .dot{background:var(--teal)}
.chip.doc .ed{cursor:pointer;color:var(--mut);font-size:12px}.chip.doc .ed:hover{color:var(--ink)}
.scenario{color:var(--mut);font-size:12.5px;margin-top:10px}
.scenario b{color:var(--ink)}
/* cards */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.kard{padding:14px;border-radius:14px;background:var(--glass);border:1px solid var(--stroke)}
.kard .l{color:var(--mut);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.kard .v{font-size:21px;font-weight:800;margin:3px 0 1px}.kard .s{color:var(--mut);font-size:12px}
/* table */
.tablewrap{overflow-x:auto;border-radius:14px;border:1px solid var(--stroke)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 11px;text-align:right;border-bottom:1px solid var(--stroke);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{background:rgba(255,255,255,.05);color:var(--mut);font-weight:600;font-size:11.5px;letter-spacing:.03em}
tfoot td{font-weight:800;background:rgba(255,255,255,.05)}tbody tr:last-child td{border-bottom:0}
td.neg{color:var(--red)}td.pos{color:var(--teal)}
.note{color:var(--mut);font-size:12.5px;margin:9px 2px 0}
/* chart */
.ct{font-size:12.5px;color:var(--mut);margin-bottom:8px}
.cwrap{position:relative;width:100%}
/* lists */
ul.list{list-style:none;padding:0;margin:0}
ul.list li{position:relative;padding:9px 0 9px 26px;border-bottom:1px solid var(--stroke);font-size:14px}
ul.list li:last-child{border-bottom:0}
ul.list li::before{position:absolute;left:2px;top:9px;font-weight:800}
ul.danger li::before{content:"▰";color:var(--red)}ul.good li::before{content:"✓";color:var(--teal)}ul.neutral li::before{content:"›";color:var(--blue)}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.callout{border-radius:14px;padding:13px 15px;font-size:13.5px;border:1px solid rgba(246,199,94,.4);background:rgba(246,199,94,.07)}
.prose{font-size:14.5px}.prose h3{margin:0 0 8px;font-size:16px}
footer{margin-top:26px;color:var(--mut);font-size:12px;border-top:1px solid var(--stroke);padding-top:14px}
/* ingestion vault */
.drop{border:1.5px dashed var(--stroke2);border-radius:16px;padding:22px 18px;text-align:center;color:var(--mut);cursor:pointer;transition:.15s;background:rgba(255,255,255,.03)}
.drop:hover,.drop.over{border-color:var(--teal);color:var(--ink);background:rgba(52,224,196,.07)}
.drop b{color:var(--ink)}.drop .sm{font-size:12px;display:block;margin-top:5px}
.search{width:100%;margin:12px 0 2px;padding:10px 13px;border-radius:11px;border:1px solid var(--stroke2);background:rgba(0,0,0,.22);color:var(--ink);font-size:13.5px}
.search:focus{outline:none;border-color:var(--teal)}
.flist{list-style:none;padding:0;margin:6px 0 0}
.frow{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--stroke);border-radius:12px;margin-top:8px;background:var(--glass)}
.frow .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:rgba(255,255,255,.06);font-size:15px;flex:0 0 auto}
.frow .meta{flex:1 1 auto;min-width:0}
.frow .fn{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow .fm{color:var(--mut);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow .act{display:flex;gap:6px;flex:0 0 auto}
.btn{cursor:pointer;border:1px solid var(--stroke2);background:var(--glass2);color:var(--mut);border-radius:9px;padding:5px 9px;font-size:12px}
.btn:hover{color:var(--ink);border-color:var(--teal)}.btn.del:hover{color:var(--red);border-color:var(--red)}
.vstat{color:var(--mut);font-size:12px;margin-top:9px;min-height:16px}
.viewer{margin-top:8px;border:1px solid var(--stroke);border-radius:12px;background:rgba(0,0,0,.32);max-height:340px;overflow:auto;padding:12px 14px;white-space:pre-wrap;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace;color:#cdd8ea;display:none}
.viewer.open{display:block}
/* positions table */
.posscroll{max-height:460px;overflow:auto}
.posscroll thead th{position:sticky;top:0;z-index:1}
.posscroll tfoot td{position:sticky;bottom:0;z-index:1}
#postable td[contenteditable]{outline:none;cursor:text}
#postable td[contenteditable]:focus{background:rgba(52,224,196,.08);box-shadow:inset 0 0 0 1px rgba(52,224,196,.45)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:.03em}
.pill.Private{background:rgba(52,224,196,.15);color:var(--teal)}
.pill.Public{background:rgba(109,181,255,.15);color:var(--blue)}
.pill.Exited{background:rgba(255,122,122,.15);color:var(--red)}
.posbtns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.chip.ghost{cursor:pointer}.chip.ghost:hover{border-color:var(--teal);color:var(--ink)}
@media(max-width:720px){.cards{grid-template-columns:1fr 1fr}.twocol{grid-template-columns:1fr}.hero h1{font-size:26px}.shell{padding:18px}.frow .fm{white-space:normal}}
</style></head><body>

<div id="lock"><form class="lockcard glass" id="lf">
  <div class="lk">🔒</div><h1>Private decision brief</h1><p>Enter password to unlock</p>
  <input id="pw" type="password" autocomplete="off" autofocus placeholder="••••" />
  <label class="remember"><input type="checkbox" id="remember" checked> Remember on this browser</label>
  <button type="submit">Unlock</button><div class="err" id="err"></div>
  <div class="hint">AES-256-GCM · content not retrievable without the password</div>
</form></div>

<div id="app">
  <button id="lockbtn" title="Lock &amp; forget on this browser">🔒 Lock</button>
  <div class="shell glass" id="root"></div>
</div>

<script>
const ENC = JSON.parse(document.getElementById('enc').textContent);
const b2u = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
let FKEY=null; // AES key for the in-browser document vault, derived from the password at unlock
async function unlock(pw){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b2u(ENC.s), iterations:200000, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b2u(ENC.i)}, key, b2u(ENC.c));
  FKEY = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b2u(ENC.s), iterations:200000, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
  return JSON.parse(new TextDecoder().decode(pt));
}
const E=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const fmt=n=>{const s=Math.abs(n).toFixed(1);return n<0?'('+s+')':s;};
const MKEY='gsv7_model', DKEY='gsv7_docs', PKEY='gsv7_pw', POSKEY='gsv7_positions';

/* ---- ingestion / save engine: IndexedDB document vault, AES-encrypted with the page password ---- */
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('gsv7vault',1);r.onupgradeneeded=()=>r.result.createObjectStore('files',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function idbAll(){const db=await idb();return new Promise((res,rej)=>{const q=db.transaction('files').objectStore('files').getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error);});}
async function idbPut(rec){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').put(rec);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}
async function idbDel(id){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').delete(id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}
async function encBytes(bytes){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},FKEY,bytes);return {iv:Array.from(iv),ct:new Uint8Array(ct)};}
async function decBytes(rec){return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(rec.iv)},FKEY,rec.ct));}
async function loadPdfjs(){
  if(window.pdfjsLib) return window.pdfjsLib;
  await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js';s.onload=res;s.onerror=()=>rej(new Error('pdf.js failed to load (offline?)'));document.head.appendChild(s);});
  window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  return window.pdfjsLib;
}
async function extractPdf(bytes){
  const lib=await loadPdfjs();
  const pdf=await lib.getDocument({data:bytes}).promise; let out='';
  for(let p=1;p<=pdf.numPages;p++){const pg=await pdf.getPage(p);const tc=await pg.getTextContent();out+=tc.items.map(i=>i.str).join(' ')+'\n\n';}
  return {text:out.trim(), pages:pdf.numPages};
}
const isPdf=f=>f.type==='application/pdf'||/\.pdf$/i.test(f.name);
const isText=f=>/^text\//.test(f.type)||/(json|csv|markdown)/.test(f.type)||/\.(txt|md|csv|json|tsv|log)$/i.test(f.name);
async function ingestFile(file, onStatus){
  const buf=new Uint8Array(await file.arrayBuffer());
  let text='', pages=0, note='';
  if(isPdf(file)){ onStatus&&onStatus('extracting text…'); try{const r=await extractPdf(buf);text=r.text;pages=r.pages;}catch(e){note='text layer unavailable: '+e.message;} }
  else if(isText(file)){ text=new TextDecoder().decode(buf); }
  else { note='stored as-is (no text layer)'; }
  onStatus&&onStatus('encrypting…');
  const blobEnc=await encBytes(buf);
  const textEnc=text?await encBytes(new TextEncoder().encode(text)):null;
  const rec={id:Date.now()+'-'+Math.random().toString(36).slice(2,7),name:file.name,mime:file.type||'application/octet-stream',size:file.size,pages,chars:text.length,note,addedAt:new Date().toISOString(),blobEnc,textEnc};
  await idbPut(rec); return rec;
}
const humanSize=b=>b<1024?b+' B':b<1048576?(b/1024).toFixed(0)+' KB':(b/1048576).toFixed(1)+' MB';
const iconFor=(mime,name)=>/pdf/.test(mime)||/\.pdf$/i.test(name)?'📕':/^image\//.test(mime)?'🖼':/csv|sheet|excel/.test(mime)?'📊':/^text\/|json|markdown/.test(mime)?'📄':'📎';
let VAULT=[];
async function loadVault(){
  const recs=await idbAll(); recs.sort((a,b)=>a.addedAt<b.addedAt?1:-1); VAULT=[];
  for(const r of recs){ let text=''; if(r.textEnc){ try{text=new TextDecoder().decode(await decBytes(r.textEnc));}catch(_){ } } VAULT.push({rec:r,text}); }
  return VAULT;
}
async function downloadRec(r){ const bytes=await decBytes(r.blobEnc); const u=URL.createObjectURL(new Blob([bytes],{type:r.mime})); const a=document.createElement('a'); a.href=u; a.download=r.name; a.click(); setTimeout(()=>URL.revokeObjectURL(u),5000); }
async function openRec(r){ const bytes=await decBytes(r.blobEnc); const u=URL.createObjectURL(new Blob([bytes],{type:r.mime})); window.open(u,'_blank'); setTimeout(()=>URL.revokeObjectURL(u),60000); }

function compute(D, st){
  const C=st.commitment, k=st.moic/D.model.baseMoic;
  const yrs=['Y1','Y2','Y3','Y4','Y5','Y6','Y7','Y8'];
  const called=D.model.callPct.map(p=>p/100*C);
  const fund=D.model.fundPct.map(p=>p/100*C*k);
  const co=D.model.coPct.map(p=>p/100*C*k);
  const total=fund.map((f,i)=>f+co[i]);
  const net=total.map((t,i)=>t-called[i]);
  let r=0; const cum=net.map(n=>r=r+n);
  const tCall=called.reduce((a,b)=>a+b,0), tDist=total.reduce((a,b)=>a+b,0);
  return {yrs,called,fund,co,total,net,cum,tCall,tDist,moic:tDist/tCall,netGain:tDist-tCall};
}

let CF=null;

function renderAlloc(D, st){
  const c=compute(D, st); CF=c;
  // table
  const tb=document.getElementById('alloc-body'); tb.innerHTML='';
  c.yrs.forEach((y,i)=>{
    const tr=E('tr');
    const cells=[y, c.called[i]?'('+c.called[i].toFixed(1)+')':'—', D.model.callPct[i]?D.model.callPct[i]+'%':'—',
      c.fund[i]?c.fund[i].toFixed(1):'—', c.co[i]?c.co[i].toFixed(1):'—', c.total[i]?c.total[i].toFixed(1):'—',
      fmt(c.net[i]), fmt(c.cum[i])];
    cells.forEach((v,j)=>{const td=E('td',null,v); if(j===6)td.className=c.net[i]<0?'neg':'pos'; if(j===7)td.className=c.cum[i]<0?'neg':'pos'; tr.appendChild(td);});
    tb.appendChild(tr);
  });
  document.getElementById('alloc-foot').innerHTML=
    '<td>Total</td><td>('+c.tCall.toFixed(1)+')</td><td>101%</td><td>'+c.fund.reduce((a,b)=>a+b,0).toFixed(1)+
    '</td><td>'+c.co.reduce((a,b)=>a+b,0).toFixed(1)+'</td><td>'+c.tDist.toFixed(1)+'</td><td class="pos">'+fmt(c.netGain)+
    '</td><td class="pos">'+fmt(c.cum[c.cum.length-1])+'</td>';
  // scenario line
  document.getElementById('scenario').innerHTML='Scenario: <b>$'+st.commitment+'m</b> commitment at <b>'+st.moic.toFixed(2)+
    '×</b> gross MOIC → called <b>$'+c.tCall.toFixed(1)+'m</b>, distributed <b>$'+c.tDist.toFixed(1)+'m</b>, net gain <b>$'+c.netGain.toFixed(1)+'m</b>.';
  // redraw the inline-SVG J-curve from the fresh figures
  if(allocRedraw) allocRedraw();
}

function chip(label, key, value, accent){
  const c=E('div','chip edit'+(accent?' accent':''));
  c.appendChild(E('span','cl',label));
  const v=E('span','cv', value); v.setAttribute('contenteditable','true'); v.dataset.key=key; c.appendChild(v);
  return c;
}

/* ---- inline SVG charts: no library, no CDN, no canvas — a fixed-height box that cannot overflow ---- */
const SC={ink:'#eaf0fa',mut:'#9fb0c8',grid:'rgba(255,255,255,.09)',zero:'rgba(255,255,255,.28)',teal:'#34e0c4',gold:'#f6c75e',red:'#ff7a7a',blue:'#6db5ff',slate:'#9fb0c8',line:'rgba(255,255,255,.92)'};
const _ln=(x1,y1,x2,y2,c,w)=>'<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+(w||1)+'"/>';
const _rc=(x,y,w,h,c,r)=>'<rect x="'+x+'" y="'+y+'" width="'+Math.max(0,w)+'" height="'+Math.max(0,h)+'" rx="'+(r==null?3:r)+'" fill="'+c+'"/>';
const _tx=(x,y,t,c,a,s,tr)=>'<text x="'+x+'" y="'+y+'" fill="'+c+'" font-size="'+(s||10)+'" text-anchor="'+(a||'start')+'"'+(tr?' transform="'+tr+'"':'')+'>'+t+'</text>';
const _ci=(x,y,r,c)=>'<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+c+'"/>';
const _pl=(pts,c,w)=>'<polyline points="'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')+'" fill="none" stroke="'+c+'" stroke-width="'+(w||2)+'" stroke-linejoin="round" stroke-linecap="round"/>';
const _open=(W,H)=>'<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" preserveAspectRatio="xMidYMid meet" style="display:block" font-family="-apple-system,Segoe UI,Roboto,sans-serif">';
function _ticks(min,max,n){const span=(max-min)||1,raw=span/n,mag=Math.pow(10,Math.floor(Math.log10(raw))),nm=raw/mag,step=(nm<1.5?1:nm<3?2:nm<7?5:10)*mag,out=[];for(let v=Math.ceil(min/step)*step;v<=max+1e-9;v+=step)out.push(Math.round(v*1e6)/1e6);return out;}
function _legend(items,x,y){let s='',lx=x;items.forEach(([c,l])=>{s+=_rc(lx,y-7,9,9,c,2)+_tx(lx+13,y+1,l,SC.mut,'start',9.5);lx+=24+String(l).length*5.7;});return s;}
const CHARTS=[]; let allocRedraw=null;
function mountChart(box, h, draw){
  const wrap=E('div','cwrap'); wrap.style.height=h+'px'; box.appendChild(wrap);
  const paint=()=>{ const W=Math.max(320,Math.round(wrap.clientWidth||box.clientWidth||700));

function drawJcurve(c, W, H){
  if(!c) return _open(W,H)+'</svg>';
  const P={l:44,r:12,t:30,b:26}, n=c.yrs.length, plotH=H-P.t-P.b, plotW=W-P.l-P.r;
  let ymax=Math.max(0,...c.total,...c.cum), ymin=Math.min(0,...c.called.map(v=>-v),...c.cum);
  const pv=(ymax-ymin)*0.08||1; ymax+=pv; ymin-=pv;
  const Y=v=>P.t+(ymax-v)/(ymax-ymin)*plotH, band=plotW/n, bw=Math.min(30,band*0.5);
  let s=_open(W,H);
  _ticks(ymin,ymax,4).forEach(tv=>{const y=Y(tv);s+=_ln(P.l,y,W-P.r,y,SC.grid)+_tx(P.l-6,y+3,tv.toFixed(0),SC.mut,'end',9.5);});
  s+=_ln(P.l,Y(0),W-P.r,Y(0),SC.zero);
  const pts=[];
  for(let i=0;i<n;i++){const cx=P.l+band*(i+0.5);
    if(c.called[i]>0){const y0=Y(0),y1=Y(-c.called[i]);s+=_rc(cx-bw/2,y0,bw,y1-y0,'rgba(255,122,122,.85)');}
    let top=0; if(c.fund[i]>0){s+=_rc(cx-bw/2,Y(c.fund[i]),bw,Y(0)-Y(c.fund[i]),'rgba(52,224,196,.92)');top=c.fund[i];}
    if(c.co[i]>0){s+=_rc(cx-bw/2,Y(top+c.co[i]),bw,Y(top)-Y(top+c.co[i]),'rgba(246,199,94,.92)');}
    s+=_tx(cx,H-9,c.yrs[i],SC.mut,'middle',9.5); pts.push([cx,Y(c.cum[i])]);
  }
  s+=_pl(pts,SC.line,2); pts.forEach(p=>s+=_ci(p[0],p[1],2.6,SC.line));
  s+=_tx(12,P.t+plotH/2,'$m',SC.mut,'middle',9.5,'rotate(-90 12 '+(P.t+plotH/2)+')');
  s+=_legend([['rgba(255,122,122,.85)','Called'],['rgba(52,224,196,.92)','Fund'],['rgba(246,199,94,.92)','Co-invest'],[SC.line,'Cumulative']],P.l,15);
  return s+'</svg>';
}
function drawTrack(D, W, H){
  const f=D.track.funds, irr=D.track.irr, dpi=D.track.dpi, n=f.length;
  const P={l:40,r:38,t:30,b:26}, plotH=H-P.t-P.b, plotW=W-P.l-P.r;
  let imin=Math.min(0,...irr), imax=Math.max(0,...irr); const pv=(imax-imin)*0.08; imin-=pv; imax+=pv;
  const dmax=Math.max(...dpi,0.1)*1.18;
  const Yi=v=>P.t+(imax-v)/(imax-imin)*plotH, Yd=v=>P.t+(dmax-v)/dmax*plotH, band=plotW/n, bw=Math.min(30,band*0.5);
  let s=_open(W,H);
  _ticks(imin,imax,4).forEach(tv=>{const y=Yi(tv);s+=_ln(P.l,y,W-P.r,y,SC.grid)+_tx(P.l-5,y+3,tv.toFixed(0),SC.mut,'end',9.5);});
  s+=_ln(P.l,Yi(0),W-P.r,Yi(0),SC.zero);
  _ticks(0,dmax,4).forEach(tv=>{s+=_tx(W-P.r+5,Yd(tv)+3,tv.toFixed(1),SC.gold,'start',9.5);});
  const pts=[];
  for(let i=0;i<n;i++){const cx=P.l+band*(i+0.5),v=irr[i];
    const y0=Yi(0),y1=Yi(v);s+=_rc(cx-bw/2,Math.min(y0,y1),bw,Math.abs(y1-y0),v<0?'rgba(255,122,122,.9)':'rgba(109,181,255,.9)');
    s+=_tx(cx,H-9,f[i].replace('GS ','GS'),SC.mut,'middle',9); pts.push([cx,Yd(dpi[i])]);
  }
  s+=_pl(pts,SC.gold,2); pts.forEach(p=>s+=_ci(p[0],p[1],2.6,SC.gold));
  s+=_tx(11,P.t+plotH/2,'IRR %',SC.mut,'middle',9.5,'rotate(-90 11 '+(P.t+plotH/2)+')');
  s+=_legend([['rgba(109,181,255,.9)','Net IRR %'],[SC.gold,'Net DPI ×']],P.l,15);
  return s+'</svg>';
}
function drawBars(labels, vals, cols, unit, W, H){
  const P={l:42,r:12,t:18,b:34}, n=labels.length, plotH=H-P.t-P.b, plotW=W-P.l-P.r;
  const mx=Math.max(...vals.filter(v=>v!=null),1)*1.15, Y=v=>P.t+(mx-v)/mx*plotH, band=plotW/n, bw=Math.min(72,band*0.46);
  let s=_open(W,H);
  _ticks(0,mx,4).forEach(tv=>{const y=Y(tv);s+=_ln(P.l,y,W-P.r,y,SC.grid)+_tx(P.l-6,y+3,tv.toFixed(0),SC.mut,'end',9.5);});
  for(let i=0;i<n;i++){const cx=P.l+band*(i+0.5);
    if(vals[i]==null){ s+='<rect x="'+(cx-bw/2)+'" y="'+(P.t)+'" width="'+bw+'" height="'+plotH+'" rx="3" fill="none" stroke="rgba(255,122,122,.5)" stroke-dasharray="4 4"/>'+_tx(cx,P.t+plotH/2,'?',SC.red,'middle',16); }
    else { s+=_rc(cx-bw/2,Y(vals[i]),bw,Y(0)-Y(vals[i]),cols[i])+_tx(cx,Y(vals[i])-5,vals[i]+unit,SC.ink,'middle',10.5); }
    String(labels[i]).split('\n').forEach((ln,k)=>s+=_tx(cx,H-20+k*11,ln,SC.mut,'middle',9.5));
  }
  return s+'</svg>';
}
function drawHBars(labels, vals, cols, unit, W, H){
  const P={l:8,r:14,t:10,b:10}, n=labels.length, rowH=(H-P.t-P.b)/n;
  const mx=Math.max(...vals,1)*1.06, plotL=P.l, plotW=W-P.l-P.r;
  let s=_open(W,H);
  for(let i=0;i<n;i++){const cy=P.t+rowH*(i+0.5);
    s+=_tx(plotL,cy-rowH*0.28,labels[i],SC.mut,'start',10);
    const bw=vals[i]/mx*plotW; s+=_rc(plotL,cy-7,bw,16,cols[i],4);
    s+=_tx(plotL+bw+7,cy+5,'$'+vals[i]+unit,SC.ink,'start',11);
  }
  return s+'</svg>';
}

    saveSt(); renderAlloc(D, st);
  }
  root.querySelectorAll('.chip.edit .cv').forEach(el=>{
    el.addEventListener('keydown',e=>{ if(e.key==='Enter'){e.preventDefault(); el.blur();} });
    el.addEventListener('blur',()=>commit(el));
    el.addEventListener('focus',()=>{ const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r); });
  });
  document.querySelector('.chip.reset').onclick=()=>{ st.commitment=D.model.commitment; st.moic=D.model.grossMoic; saveSt(); render(D); };

  // initial compute
  renderAlloc(D, st);
}

// lock flow
function showApp(d){ document.getElementById('lock').style.display='none'; document.getElementById('app').style.display='block'; render(d); window.scrollTo(0,0); }
document.getElementById('lf').addEventListener('submit', async (e)=>{
  e.preventDefault(); const err=document.getElementById('err'); err.textContent=''; const pw=document.getElementById('pw').value;
  try{ const d=await unlock(pw); if(document.getElementById('remember').checked){try{localStorage.setItem(PKEY,pw)}catch(_){ }} showApp(d); }
  catch(_){ err.textContent='Wrong password.'; document.getElementById('pw').value=''; }
});
document.getElementById('lockbtn').addEventListener('click', ()=>{ try{localStorage.removeItem(PKEY)}catch(_){ }; location.reload(); });
(async()=>{ let s=null; try{s=localStorage.getItem(PKEY)}catch(_){ } if(s){ try{ showApp(await unlock(s)); }catch(_){ try{localStorage.removeItem(PKEY)}catch(_){ } } } })();
</script></body></html>
