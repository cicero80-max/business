<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Private brief</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --ink:#eaf0fa;--mut:#9fb0c8;--teal:#34e0c4;--gold:#f6c75e;--red:#ff7a7a;--blue:#6db5ff;--violet:#a78bfa;
  --glass:rgba(255,255,255,.055);--glass2:rgba(255,255,255,.085);--stroke:rgba(255,255,255,.12);--stroke2:rgba(255,255,255,.20);
  --shadow:0 18px 50px rgba(0,0,0,.45);--inlite:inset 0 1px 0 rgba(255,255,255,.14);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;background:#05070e;min-height:100vh;
  background-image:
    radial-gradient(900px 600px at 12% -8%, rgba(52,224,196,.18), transparent 60%),
    radial-gradient(900px 700px at 92% 4%, rgba(120,110,255,.20), transparent 60%),
    radial-gradient(800px 600px at 60% 100%, rgba(246,199,94,.10), transparent 60%),
    linear-gradient(180deg,#070b16,#05070e);
  background-attachment:fixed;
}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
.glass{background:var(--glass);border:1px solid var(--stroke);border-radius:22px;
  -webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%);box-shadow:var(--shadow),var(--inlite)}
/* lock */
#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.lockcard{width:100%;max-width:380px;padding:34px 30px;text-align:center}
.lockcard .lk{font-size:30px}.lockcard h1{font-size:18px;margin:14px 0 4px}.lockcard p{color:var(--mut);font-size:13px;margin:0 0 18px}
#pw{width:100%;padding:13px 14px;border-radius:13px;border:1px solid var(--stroke2);background:rgba(0,0,0,.25);color:var(--ink);font-size:15px;text-align:center;letter-spacing:.14em}
#pw:focus{outline:none;border-color:var(--teal)}
.lockcard button{margin-top:12px;width:100%;padding:13px;border:0;border-radius:13px;background:linear-gradient(180deg,#3df0d2,#1fbfa6);color:#04211c;font-weight:800;font-size:15px;cursor:pointer}
.remember{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:12px;color:var(--mut);font-size:12.5px;cursor:pointer}
.remember input{accent-color:var(--teal)}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:10px}.hint{color:#5b6b86;font-size:11px;margin-top:14px}
#lockbtn{position:fixed;top:14px;right:14px;z-index:9;cursor:pointer;border-radius:12px;padding:7px 12px;font-size:12px;color:var(--mut);
  background:var(--glass2);border:1px solid var(--stroke2);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
#lockbtn:hover{color:var(--ink)}
/* layout — one layered surface */
#app{display:none}
.shell{max-width:1000px;margin:26px auto;padding:26px 26px 36px}
.panel{padding:18px 18px;margin:14px 0;border-radius:18px;background:var(--glass2);border:1px solid var(--stroke);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:var(--inlite)}
.eyebrow{color:var(--teal);font-size:12px;letter-spacing:.2em;font-weight:700}
.hero h1{font-size:34px;letter-spacing:-.02em;margin:8px 0 4px}
.hero .sub{color:var(--mut);font-size:15px;margin-bottom:14px}
.verdict{font-size:14.5px;border-left:3px solid var(--gold);padding-left:14px}
h2.sec{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin:30px 4px 10px}
/* chips */
.chips{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:9px;padding:9px 14px;border-radius:999px;background:var(--glass2);
  border:1px solid var(--stroke2);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:var(--inlite);font-size:13.5px}
.chip .cl{color:var(--mut);font-size:11.5px;letter-spacing:.04em}
.chip .cv{font-weight:800;color:var(--ink)}
.chip.edit .cv{outline:none;min-width:18px;padding:0 2px;border-bottom:1px dashed rgba(255,255,255,.35);cursor:text}
.chip.edit .cv:focus{border-bottom-color:var(--teal);background:rgba(52,224,196,.08)}
.chip.edit::after{content:'✎';font-size:11px;opacity:.45}
.chip.accent{border-color:rgba(52,224,196,.5);box-shadow:0 0 0 1px rgba(52,224,196,.15) inset,var(--inlite)}
.chip.reset{cursor:pointer;color:var(--mut)}.chip.reset:hover{color:var(--ink)}
.chip.doc{cursor:default}
.chip.doc .dot{width:7px;height:7px;border-radius:50%;background:var(--mut)}
.chip.doc.has .dot{background:var(--teal)}
.chip.doc .ed{cursor:pointer;color:var(--mut);font-size:12px}.chip.doc .ed:hover{color:var(--ink)}
.scenario{color:var(--mut);font-size:12.5px;margin-top:10px}
.scenario b{color:var(--ink)}
/* cards */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.kard{padding:14px;border-radius:14px;background:var(--glass);border:1px solid var(--stroke)}
.kard .l{color:var(--mut);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.kard .v{font-size:21px;font-weight:800;margin:3px 0 1px}.kard .s{color:var(--mut);font-size:12px}
/* table */
.tablewrap{overflow-x:auto;border-radius:14px;border:1px solid var(--stroke)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 11px;text-align:right;border-bottom:1px solid var(--stroke);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{background:rgba(255,255,255,.05);color:var(--mut);font-weight:600;font-size:11.5px;letter-spacing:.03em}
tfoot td{font-weight:800;background:rgba(255,255,255,.05)}tbody tr:last-child td{border-bottom:0}
td.neg{color:var(--red)}td.pos{color:var(--teal)}
.note{color:var(--mut);font-size:12.5px;margin:9px 2px 0}
/* chart */
.ct{font-size:12.5px;color:var(--mut);margin-bottom:8px}
.cwrap{position:relative;width:100%}
/* lists */
ul.list{list-style:none;padding:0;margin:0}
ul.list li{position:relative;padding:9px 0 9px 26px;border-bottom:1px solid var(--stroke);font-size:14px}
ul.list li:last-child{border-bottom:0}
ul.list li::before{position:absolute;left:2px;top:9px;font-weight:800}
ul.danger li::before{content:"▰";color:var(--red)}ul.good li::before{content:"✓";color:var(--teal)}ul.neutral li::before{content:"›";color:var(--blue)}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.callout{border-radius:14px;padding:13px 15px;font-size:13.5px;border:1px solid rgba(246,199,94,.4);background:rgba(246,199,94,.07)}
.prose{font-size:14.5px}.prose h3{margin:0 0 8px;font-size:16px}
footer{margin-top:26px;color:var(--mut);font-size:12px;border-top:1px solid var(--stroke);padding-top:14px}
@media(max-width:720px){.cards{grid-template-columns:1fr 1fr}.twocol{grid-template-columns:1fr}.hero h1{font-size:26px}.shell{padding:18px}}
</style></head><body>

<div id="lock"><form class="lockcard glass" id="lf">
  <div class="lk">🔒</div><h1>Private decision brief</h1><p>Enter password to unlock</p>
  <input id="pw" type="password" autocomplete="off" autofocus placeholder="••••" />
  <label class="remember"><input type="checkbox" id="remember" checked> Remember on this browser</label>
  <button type="submit">Unlock</button><div class="err" id="err"></div>
  <div class="hint">AES-256-GCM · content not retrievable without the password</div>
</form></div>

<div id="app">
  <button id="lockbtn" title="Lock &amp; forget on this browser">🔒 Lock</button>
  <div class="shell glass" id="root"></div>
</div>

<script>
const ENC = JSON.parse(document.getElementById('enc').textContent);
const b2u = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function unlock(pw){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b2u(ENC.s), iterations:200000, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b2u(ENC.i)}, key, b2u(ENC.c));
  return JSON.parse(new TextDecoder().decode(pt));
}
const E=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const fmt=n=>{const s=Math.abs(n).toFixed(1);return n<0?'('+s+')':s;};
const MKEY='gsv7_model', DKEY='gsv7_docs', PKEY='gsv7_pw';

function compute(D, st){
  const C=st.commitment, k=st.moic/D.model.baseMoic;
  const yrs=['Y1','Y2','Y3','Y4','Y5','Y6','Y7','Y8'];
  const called=D.model.callPct.map(p=>p/100*C);
  const fund=D.model.fundPct.map(p=>p/100*C*k);
  const co=D.model.coPct.map(p=>p/100*C*k);
  const total=fund.map((f,i)=>f+co[i]);
  const net=total.map((t,i)=>t-called[i]);
  let r=0; const cum=net.map(n=>r=r+n);
  const tCall=called.reduce((a,b)=>a+b,0), tDist=total.reduce((a,b)=>a+b,0);
  return {yrs,called,fund,co,total,net,cum,tCall,tDist,moic:tDist/tCall,netGain:tDist-tCall};
}

let CF=null, allocChart=null;

function renderAlloc(D, st){
  const c=compute(D, st); CF=c;
  // table
  const tb=document.getElementById('alloc-body'); tb.innerHTML='';
  c.yrs.forEach((y,i)=>{
    const tr=E('tr');
    const cells=[y, c.called[i]?'('+c.called[i].toFixed(1)+')':'—', D.model.callPct[i]?D.model.callPct[i]+'%':'—',
      c.fund[i]?c.fund[i].toFixed(1):'—', c.co[i]?c.co[i].toFixed(1):'—', c.total[i]?c.total[i].toFixed(1):'—',
      fmt(c.net[i]), fmt(c.cum[i])];
    cells.forEach((v,j)=>{const td=E('td',null,v); if(j===6)td.className=c.net[i]<0?'neg':'pos'; if(j===7)td.className=c.cum[i]<0?'neg':'pos'; tr.appendChild(td);});
    tb.appendChild(tr);
  });
  document.getElementById('alloc-foot').innerHTML=
    '<td>Total</td><td>('+c.tCall.toFixed(1)+')</td><td>101%</td><td>'+c.fund.reduce((a,b)=>a+b,0).toFixed(1)+
    '</td><td>'+c.co.reduce((a,b)=>a+b,0).toFixed(1)+'</td><td>'+c.tDist.toFixed(1)+'</td><td class="pos">'+fmt(c.netGain)+
    '</td><td class="pos">'+fmt(c.cum[c.cum.length-1])+'</td>';
  // scenario line
  document.getElementById('scenario').innerHTML='Scenario: <b>$'+st.commitment+'m</b> commitment at <b>'+st.moic.toFixed(2)+
    '×</b> gross MOIC → called <b>$'+c.tCall.toFixed(1)+'m</b>, distributed <b>$'+c.tDist.toFixed(1)+'m</b>, net gain <b>$'+c.netGain.toFixed(1)+'m</b>.';
  // chart
  const ds=[
    {type:'bar',label:'Capital called',data:c.called.map(v=>-v),backgroundColor:'rgba(255,122,122,.85)',stack:'s',borderRadius:4},
    {type:'bar',label:'Fund distributions',data:c.fund,backgroundColor:'rgba(52,224,196,.9)',stack:'s',borderRadius:4},
    {type:'bar',label:'Co-investment distributions',data:c.co,backgroundColor:'rgba(246,199,94,.9)',stack:'s',borderRadius:4},
    {type:'line',label:'Cumulative net',data:c.cum,borderColor:'rgba(255,255,255,.9)',backgroundColor:'rgba(255,255,255,.9)',borderWidth:2,tension:.25,pointRadius:3,fill:false},
  ];
  const cv=document.getElementById('alloc-canvas');
  if(allocChart){ allocChart.data.datasets.forEach((d,i)=>d.data=ds[i].data); allocChart.update(); }
  else if(window.Chart && cv){
    allocChart=new Chart(cv.getContext('2d'),{type:'bar',data:{labels:c.yrs,datasets:ds},options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{labels:{color:'#9fb0c8',boxWidth:12,font:{size:11}}}},
      scales:{x:{stacked:true,grid:{color:'rgba(255,255,255,.08)'},ticks:{color:'#9fb0c8'}},
        y:{stacked:true,grid:{color:'rgba(255,255,255,.08)'},ticks:{color:'#9fb0c8'},title:{display:true,text:'$m',color:'#9fb0c8'}}}}});
  }
}

function chip(label, key, value, accent){
  const c=E('div','chip edit'+(accent?' accent':''));
  c.appendChild(E('span','cl',label));
  const v=E('span','cv', value); v.setAttribute('contenteditable','true'); v.dataset.key=key; c.appendChild(v);
  return c;
}

function makeChart(box, h, build){
  const wrap=E('div','cwrap'); wrap.style.height=h+'px';
  const cv=document.createElement('canvas'); wrap.appendChild(cv); box.appendChild(wrap);
  try{ if(!window.Chart) throw new Error('Chart.js failed to load (offline?)'); build(cv); }
  catch(err){ wrap.style.height='auto'; wrap.innerHTML='<div class="note">[chart unavailable — '+((err&&err.message)||err)+']</div>'; }
}

function render(D){
  const root=document.getElementById('root'); root.innerHTML='';
  // state
  let st=Object.assign({commitment:D.model.commitment, moic:D.model.grossMoic});
  try{const s=JSON.parse(localStorage.getItem(MKEY)||'{}'); if(s.commitment)st.commitment=s.commitment; if(s.moic)st.moic=s.moic;}catch(_){ }
  let docUrls={}; try{docUrls=JSON.parse(localStorage.getItem(DKEY)||'{}')}catch(_){ }
  const saveSt=()=>{try{localStorage.setItem(MKEY,JSON.stringify(st))}catch(_){ }};
  const saveDocs=()=>{try{localStorage.setItem(DKEY,JSON.stringify(docUrls))}catch(_){ }};

  // HERO
  const hero=E('div','hero panel');
  hero.appendChild(E('div','eyebrow','CONFIDENTIAL · PRIVATE BRIEF'));
  hero.appendChild(E('h1',null,D.meta.title));
  hero.appendChild(E('div','sub',D.meta.subtitle));
  hero.appendChild(E('div','verdict',D.verdict));
  root.appendChild(hero);

  // ASSUMPTION CHIPS
  root.appendChild(E('h2','sec','Adjust the scenario'));
  const cp=E('div','panel');
  const chips=E('div','chips');
  chips.appendChild(chip('Commitment','commitment','$'+st.commitment+'m', true));
  chips.appendChild(chip('Gross MOIC','moic', st.moic.toFixed(2)+'×', true));
  const reset=E('div','chip reset','↺ Reset'); chips.appendChild(reset);
  cp.appendChild(chips);
  cp.appendChild(E('div','scenario','', )); cp.lastChild.id='scenario';
  root.appendChild(cp);

  // DEAL CARDS
  root.appendChild(E('h2','sec','The deal at a glance'));
  const cardsP=E('div','panel'); const grid=E('div','cards');
  D.cards.forEach(k=>{const kk=E('div','kard'); kk.appendChild(E('div','l',k.label)); kk.appendChild(E('div','v',k.value)); kk.appendChild(E('div','s',k.sub)); grid.appendChild(kk);});
  cardsP.appendChild(grid); root.appendChild(cardsP);

  // ALLOCATION (live)
  root.appendChild(E('h2','sec','Allocation & cash-flow — live'));
  const alloc=E('div','panel');
  const tw=E('div','tablewrap'); const t=E('table');
  const cols=['Year','Called ($m)','% of commit','Fund distrib.','Co-invest','Total distrib.','Net','Cumulative'];
  const thead=E('thead'); const htr=E('tr'); cols.forEach(c=>htr.appendChild(E('th',null,c))); thead.appendChild(htr); t.appendChild(thead);
  const tbody=E('tbody'); tbody.id='alloc-body'; t.appendChild(tbody);
  const tfoot=E('tfoot'); const ftr=E('tr'); ftr.id='alloc-foot'; tfoot.appendChild(ftr); t.appendChild(tfoot);
  tw.appendChild(t); alloc.appendChild(tw);
  alloc.appendChild(E('div','note','Illustrative (Mirabaud), <b>gross of fees</b>. Edit the chips above to rescale — the table & chart recompute live.'));
  alloc.appendChild(E('div','ct','Cash-flow J-curve ($m)'));
  makeChart(alloc, 320, (cv)=>{ cv.id='alloc-canvas'; }); // canvas tagged here; chart instantiated in renderAlloc (live)
  root.appendChild(alloc);

  // TRACK RECORD
  root.appendChild(E('h2','sec','Track record — strong early, weak recent'));
  const trk=E('div','panel');
  const tw2=E('div','tablewrap'); const t2=E('table');
  const c2=['Fund','Vintage','Size','Net IRR','Net DPI','Status']; const th2=E('thead'); const h2r=E('tr'); c2.forEach(c=>h2r.appendChild(E('th',null,c))); th2.appendChild(h2r); t2.appendChild(th2);
  const tb2=E('tbody'); D.track.funds.forEach((f,i)=>{const tr=E('tr');
    [f,D.track.vintage[i],D.track.size[i],(D.track.irr[i]>0?'+':'')+D.track.irr[i].toFixed(1)+'%',D.track.dpi[i].toFixed(2)+'×',D.track.status[i]]
    .forEach((v,j)=>{const td=E('td',null,v); if(j===3)td.className=D.track.irr[i]<0?'neg':'pos'; tr.appendChild(td);}); tb2.appendChild(tr);});
  t2.appendChild(tb2); tw2.appendChild(t2); trk.appendChild(tw2);
  trk.appendChild(E('div','note','*GS VII 122.3% is <b>de-annualised, &lt;12-mo, fully unrealised</b> — a paper markup, not cash. GS V is a realised loss; GS VI/VII have ~0 DPI.'));
  trk.appendChild(E('div','ct','Net IRR (bars) vs Net DPI / cash returned (line)'));
  makeChart(trk, 320, (cv)=>{ new Chart(cv.getContext('2d'),{type:'bar',
    data:{labels:D.track.funds,datasets:[
      {type:'bar',label:'Net IRR (%)',yAxisID:'y',data:D.track.irr,borderRadius:4,backgroundColor:D.track.irr.map(v=>v<0?'rgba(255,122,122,.9)':'rgba(109,181,255,.9)')},
      {type:'line',label:'Net DPI (×)',yAxisID:'y1',data:D.track.dpi,borderColor:'#f6c75e',backgroundColor:'#f6c75e',borderWidth:2,tension:.2,pointRadius:4}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#9fb0c8',boxWidth:12,font:{size:11}}}},
      scales:{x:{grid:{color:'rgba(255,255,255,.08)'},ticks:{color:'#9fb0c8'}},
        y:{position:'left',grid:{color:'rgba(255,255,255,.08)'},ticks:{color:'#9fb0c8'},title:{display:true,text:'Net IRR %',color:'#9fb0c8'}},
        y1:{position:'right',grid:{drawOnChartArea:false},ticks:{color:'#f6c75e'},title:{display:true,text:'Net DPI ×',color:'#f6c75e'}}}}}); });
  root.appendChild(trk);

  // FEE LAYERS
  root.appendChild(E('h2','sec','Where the return goes — two fee layers'));
  const fee=E('div','panel');
  fee.appendChild(E('div','ct','25% gross target → after fees (illustrative)'));
  makeChart(fee, 280, (cv)=>{ new Chart(cv.getContext('2d'),{type:'bar',
    data:{labels:['Gross IRR target','After G Squared 2/20*','After Mirabaud layer'],datasets:[{label:'IRR %',data:[25,17,null],borderRadius:5,backgroundColor:['rgba(52,224,196,.9)','rgba(246,199,94,.9)','rgba(255,122,122,.9)']}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:'rgba(255,255,255,.08)'},ticks:{color:'#9fb0c8'}},y:{grid:{color:'rgba(255,255,255,.08)'},ticks:{color:'#9fb0c8'},title:{display:true,text:'IRR %',color:'#9fb0c8'}}}}}); });
  fee.appendChild(E('div','note','*Illustrative. ~17% after a typical 2/20 is indicative only; Mirabaud’s nominee fee is charged <b>at its sole discretion</b> and undisclosed — true net is unknown and lower. The 25% headline ignores <b>both</b> layers.'));
  root.appendChild(fee);

  // ANTHROPIC
  root.appendChild(E('h2','sec','The Anthropic claim'));
  const an=E('div','panel');
  an.appendChild(E('div','ct','Claimed valuation gap (US$ bn)'));
  makeChart(an, 230, (cv)=>{ new Chart(cv.getContext('2d'),{type:'bar',data:{labels:['Implied in portfolio','Recent market indication'],datasets:[{label:'US$ bn',data:[210,965],borderRadius:5,backgroundColor:['rgba(159,176,200,.8)','rgba(109,181,255,.9)']}]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:'rgba(255,255,255,.08)'},ticks:{color:'#9fb0c8'}},y:{grid:{display:false},ticks:{color:'#9fb0c8'}}}}}); });
  an.appendChild(E('div','callout','⚠️ This ~4.6× “gap” is the pitch’s centrepiece — but it is <b>not in the PPM</b>, the fund is a blind pool, and neither $210B nor $965B is substantiated in any document provided. Unverified marketing until Mirabaud shows the NAV.'));
  root.appendChild(an);

  // FLAGS + GOOD (two-col on one surface)
  root.appendChild(E('h2','sec','Risk flags & what checks out'));
  const tc=E('div','panel'); const two=E('div','twocol');
  const colA=E('div'); colA.appendChild(E('div','ct','🚩 Red flags / watch-items'));
  const ulA=E('ul','list danger'); D.flags.forEach(i=>ulA.appendChild(E('li',null,i))); colA.appendChild(ulA);
  const colB=E('div'); colB.appendChild(E('div','ct','✅ Reassurances'));
  const ulB=E('ul','list good'); D.good.forEach(i=>ulB.appendChild(E('li',null,i))); colB.appendChild(ulB);
  two.appendChild(colA); two.appendChild(colB); tc.appendChild(two); root.appendChild(tc);

  // DILIGENCE
  root.appendChild(E('h2','sec','Diligence questions for Mirabaud'));
  const dp=E('div','panel'); const uld=E('ul','list neutral'); D.diligence.forEach(i=>uld.appendChild(E('li',null,i))); dp.appendChild(uld); root.appendChild(dp);

  // DOCUMENTS (editable link chips)
  root.appendChild(E('h2','sec','Source documents'));
  const dd=E('div','panel'); const dchips=E('div','chips');
  D.docs.forEach((doc,i)=>{
    const has=!!docUrls[i];
    const c=E('div','chip doc'+(has?' has':''));
    c.appendChild(E('span','dot'));
    const nm = has ? '<a href="'+docUrls[i]+'" target="_blank" rel="noopener">'+doc.name+' ↗</a>' : doc.name;
    const lab=E('span','cl', '<b style="color:var(--ink)">'+nm+'</b> · '+doc.note); c.appendChild(lab);
    const ed=E('span','ed', has?'edit':'+ link');
    ed.onclick=()=>{ const u=prompt('Link for: '+doc.name, docUrls[i]||'https://'); if(u===null)return; if(u.trim()==='') {delete docUrls[i];} else {docUrls[i]=u.trim();} saveDocs(); render(D); window.scrollTo(0,document.body.scrollHeight*0.92); };
    c.appendChild(ed); dchips.appendChild(c);
  });
  dd.appendChild(dchips);
  dd.appendChild(E('div','note','Paste your own links (Passthrough / data-room / local copies). Saved in this browser only.'));
  root.appendChild(dd);

  // BOTTOM LINE
  root.appendChild(E('h2','sec','Bottom line'));
  const bp=E('div','panel prose'); bp.appendChild(E('div',null,D.bottomLine)); root.appendChild(bp);
  root.appendChild(E('footer',null,D.footer));

  // wire chips (contenteditable)
  function commit(el){
    const key=el.dataset.key; const raw=el.textContent.replace(/[^0-9.]/g,''); let n=parseFloat(raw);
    if(key==='commitment'){ if(!isFinite(n))n=st.commitment; n=Math.max(0.1,Math.min(500,n)); st.commitment=Math.round(n*10)/10; el.textContent='$'+st.commitment+'m'; }
    if(key==='moic'){ if(!isFinite(n))n=st.moic; n=Math.max(0.1,Math.min(6,n)); st.moic=Math.round(n*100)/100; el.textContent=st.moic.toFixed(2)+'×'; }
    saveSt(); renderAlloc(D, st);
  }
  root.querySelectorAll('.chip.edit .cv').forEach(el=>{
    el.addEventListener('keydown',e=>{ if(e.key==='Enter'){e.preventDefault(); el.blur();} });
    el.addEventListener('blur',()=>commit(el));
    el.addEventListener('focus',()=>{ const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r); });
  });
  document.querySelector('.chip.reset').onclick=()=>{ st.commitment=D.model.commitment; st.moic=D.model.grossMoic; saveSt(); render(D); };

  // initial compute
  renderAlloc(D, st);
}

// lock flow
function showApp(d){ document.getElementById('lock').style.display='none'; document.getElementById('app').style.display='block'; render(d); window.scrollTo(0,0); }
document.getElementById('lf').addEventListener('submit', async (e)=>{
  e.preventDefault(); const err=document.getElementById('err'); err.textContent=''; const pw=document.getElementById('pw').value;
  try{ const d=await unlock(pw); if(document.getElementById('remember').checked){try{localStorage.setItem(PKEY,pw)}catch(_){ }} showApp(d); }
  catch(_){ err.textContent='Wrong password.'; document.getElementById('pw').value=''; }
});
document.getElementById('lockbtn').addEventListener('click', ()=>{ try{localStorage.removeItem(PKEY)}catch(_){ }; location.reload(); });
(async()=>{ let s=null; try{s=localStorage.getItem(PKEY)}catch(_){ } if(s){ try{ showApp(await unlock(s)); }catch(_){ try{localStorage.removeItem(PKEY)}catch(_){ } } } })();
</script></body></html>
