<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Private brief</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#0a0e1a;--card:#111827;--card2:#0f1626;--bd:#1e293b;--tx:#e5e9f0;--mut:#94a3b8;--teal:#2dd4bf;--gold:#f5c451;--red:#f87171;--blue:#60a5fa}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 700px at 70% -10%,#10204a 0%,var(--bg) 55%);color:var(--tx);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--blue)}
.wrap{max-width:980px;margin:0 auto;padding:28px 20px 80px}
/* lock */
#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.lockcard{width:100%;max-width:380px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:30px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.lockcard .lk{font-size:30px}
.lockcard h1{font-size:17px;margin:14px 0 4px}
.lockcard p{color:var(--mut);font-size:13px;margin:0 0 18px}
.lockcard input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--card2);color:var(--tx);font-size:15px;text-align:center;letter-spacing:.12em}
.lockcard input:focus{outline:none;border-color:var(--teal)}
.lockcard button{margin-top:12px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--teal);color:#06231f;font-weight:700;font-size:15px;cursor:pointer}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:10px}
.hint{color:#475569;font-size:11px;margin-top:14px}
/* app */
#app{display:none}
.eyebrow{color:var(--teal);font-size:12px;letter-spacing:.18em;font-weight:700}
.hero h1{font-size:30px;line-height:1.15;margin:10px 0 6px}
.hero .sub{color:var(--mut);font-size:15px;margin-bottom:16px}
.verdict{background:linear-gradient(180deg,#13233f,#0f1626);border:1px solid var(--bd);border-left:3px solid var(--gold);border-radius:12px;padding:16px 18px;font-size:14.5px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.card .l{color:var(--mut);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.card .v{font-size:22px;font-weight:700;margin:4px 0 2px}
.card .s{color:var(--mut);font-size:12px}
h2.sec{font-size:18px;margin:34px 0 12px;padding-top:10px;border-top:1px solid var(--bd)}
.callout{border-radius:12px;padding:14px 16px;font-size:14px;border:1px solid var(--bd)}
.callout.warn{background:#2a1f0c;border-color:#5b4310}
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{background:var(--card2);color:var(--mut);font-weight:600;font-size:12px}
tfoot td{font-weight:700;background:var(--card2)}
tbody tr:last-child td{border-bottom:0}
.tablewrap{overflow-x:auto;border-radius:12px}
.note{color:var(--mut);font-size:12.5px;margin:8px 2px 0}
.chartbox{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.chartbox .ct{font-size:13px;color:var(--mut);margin-bottom:8px}
ul.list{list-style:none;padding:0;margin:0}
ul.list li{position:relative;padding:8px 0 8px 26px;border-bottom:1px solid var(--bd);font-size:14px}
ul.list li:last-child{border-bottom:0}
ul.list li:before{position:absolute;left:2px;top:8px;font-weight:800}
ul.danger li:before{content:"▰";color:var(--red)}
ul.good li:before{content:"✓";color:var(--teal)}
ul.neutral li:before{content:"›";color:var(--blue)}
.prose{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px 18px;font-size:14.5px}
.prose h3{margin:0 0 8px;font-size:16px}
footer{margin-top:30px;color:var(--mut);font-size:12px;border-top:1px solid var(--bd);padding-top:14px}
@media(max-width:680px){.cards{grid-template-columns:1fr 1fr}.hero h1{font-size:24px}}
</style></head><body>
<div id="lock"><form class="lockcard" id="lf">
  <div class="lk">🔒</div>
  <h1>Private decision brief</h1>
  <p>Enter password to unlock</p>
  <input id="pw" type="password" autocomplete="off" autofocus placeholder="••••" />
  <button type="submit">Unlock</button>
  <div class="err" id="err"></div>
  <div class="hint">AES-256-GCM encrypted · content is not retrievable without the password</div>
</form></div>

const b2u = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function unlock(pw){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b2u(ENC.s), iterations:200000, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b2u(ENC.i)}, key, b2u(ENC.c));
  return JSON.parse(new TextDecoder().decode(pt));
}
function el(t,c,h){const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;}
function render(data){
  const root = document.getElementById('root'); root.innerHTML='';
  for(const s of data.sections){
    if(s.kind==='hero'){
      const d=el('div','hero');
      d.appendChild(el('div','eyebrow',s.eyebrow));
      d.appendChild(el('h1',null,s.title));
      d.appendChild(el('div','sub',s.subtitle));
      d.appendChild(el('div','verdict',s.verdict));
      root.appendChild(d);
    } else if(s.kind==='cards'){
      const g=el('div','cards');
      for(const c of s.cards){const cc=el('div','card'); cc.appendChild(el('div','l',c.label)); cc.appendChild(el('div','v',c.value)); cc.appendChild(el('div','s',c.sub)); g.appendChild(cc);}
      root.appendChild(g);
    } else if(s.kind==='h'){ root.appendChild(el('h2','sec',s.text));
    } else if(s.kind==='callout'){ const c=el('div','callout '+(s.tone||'')); if(s.title)c.appendChild(el('b',null,s.title+' — ')); c.insertAdjacentHTML('beforeend',s.body); root.appendChild(c);
    } else if(s.kind==='table'){
      const w=el('div','tablewrap'); const t=el('table');
      const th=el('thead'); const tr=el('tr'); s.columns.forEach(c=>tr.appendChild(el('th',null,c))); th.appendChild(tr); t.appendChild(th);
      const tb=el('tbody'); s.rows.forEach(r=>{const x=el('tr'); r.forEach(c=>x.appendChild(el('td',null,c))); tb.appendChild(x);}); t.appendChild(tb);
      if(s.footer){const tf=el('tfoot'); const x=el('tr'); s.footer.forEach(c=>x.appendChild(el('td',null,c))); tf.appendChild(x); t.appendChild(tf);}
      w.appendChild(t); root.appendChild(w);
      if(s.note) root.appendChild(el('div','note',s.note));
    } else if(s.kind==='chart'){
      const box=el('div','chartbox'); box.appendChild(el('div','ct',s.title));
      const cv=document.createElement('canvas'); cv.style.height=(s.h||320)+'px'; box.appendChild(cv); root.appendChild(box);
      new Chart(cv.getContext('2d'), s.spec);
      if(s.note) root.appendChild(el('div','note',s.note));
    } else if(s.kind==='list'){
      const u=el('ul','list '+(s.tone||'neutral')); s.items.forEach(i=>u.appendChild(el('li',null,i))); root.appendChild(u);
    } else if(s.kind==='prose'){
      const p=el('div','prose'); if(s.title)p.appendChild(el('h3',null,s.title)); p.insertAdjacentHTML('beforeend',s.html); root.appendChild(p);
    } else if(s.kind==='footer'){ root.appendChild(el('footer',null,s.html)); }
  }
}
document.getElementById('lf').addEventListener('submit', async (e)=>{
  e.preventDefault(); const err=document.getElementById('err'); err.textContent='';
  try{
    const data = await unlock(document.getElementById('pw').value);
    document.getElementById('lock').style.display='none';
    document.getElementById('app').style.display='block';
    render(data); window.scrollTo(0,0);
  }catch(_){ err.textContent='Wrong password.'; document.getElementById('pw').value=''; }
});
</script></body></html>
